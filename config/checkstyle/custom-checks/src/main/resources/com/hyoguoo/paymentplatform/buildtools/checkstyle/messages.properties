swallowed.broad.exception=광범위 예외(Exception/RuntimeException/Throwable/Error)를 잡고 아무 동작도 하지 않는다 — 최소한 로그 후 재 throw 또는 명시적 fallback 이 필요하다 (error-logging.md catch swallow 금지).
tryblock.external.reassignment=try 블록 밖에서 선언한 변수 "{0}"를 try 블록 안에서 재할당한다 — private 메서드로 추출해 try 안에서 바로 반환하거나 던진다 (code-style.md try 블록 패턴).
