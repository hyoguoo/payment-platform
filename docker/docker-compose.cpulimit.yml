# 컨테이너별 CPU 상한 — 스케일아웃 판정 측정 전용 override.
#
# 왜 필요한가:
#   제한이 없으면 payment-service 한 대가 호스트 10코어를 전부 쓸 수 있고, 두 대일 때도
#   둘이 합쳐 10코어다. 즉 인스턴스를 늘려도 앱에 주어지는 CPU 총량이 하나도 안 는다 —
#   그 상태로 잰 "1대 → 2대 처리율 배수"는 스케일아웃이 아니라 같은 파이를 쪼갠 결과다.
#   (실측: 2대 사이클에서 컨테이너 CPU 최댓값 합이 1,208% 로 가용 10코어를 넘겼다.)
#
# 설계 — 조이는 것은 payment 하나뿐이다:
#   - payment-service 만 인스턴스당 고정 예산을 받는다 → 1대 1.2 / 2대 2.4 코어.
#     대수를 늘리면 앱 CPU 총량이 실제로 2배가 된다. 이것이 이 측정의 유일한 변수이고,
#     의도적으로 좁게 잡아 이 자원이 병목이 되게 한다 — 그래야 "이 자원을 2배 주면
#     처리량이 2배 되는가"라는 질문이 성립한다.
#   - 공유 자원(pg / mysql 원본·복제본 / kafka / redis)은 실측 피크보다 넉넉히 얹어
#     절대 병목이 되지 않게 한다. 여기가 막히면 측정하는 것은 아키텍처가 아니라
#     내가 정한 상한값이 된다.
#     (실제로 겪었다 — pg 를 피크 137% 아래인 120% 로 잘랐더니 부하 중 117%/120% 로
#      붙어 스로틀 173회, kafka 는 평균 27% 인데도 짧은 스파이크가 0.8 상한에 부딪혀
#      스로틀 487회가 났다. 둘 다 상한을 피크 위로 올렸다.)
#   - 상한이 실제로 물렸는지는 결과 JSON 의 resource_usage.cpu_throttle 로 판정한다.
#     payment 만 스로틀되면 예산 설계가 맞은 것이고, 공유 자원이 스로틀되면 틀린 것이다.
#
# 상한을 거는 대상은 측정 대상뿐이다:
#   주변 서비스(eureka / user / product / gateway / 나머지 MySQL)와 관측 스택에는 상한을 걸지
#   않는다. 실측 정상 사용량이 eureka 10% · user 6.5% · product 15% · gateway 12% 로 스스로
#   충분히 낮아 조여서 얻을 게 없는 반면, JVM 기동은 정상 사용량보다 훨씬 CPU 를 많이 써서
#   상한을 낮게 걸면 기동이 compose 의존 대기(healthcheck)를 넘겨 스택이 아예 못 뜬다
#   (eureka 를 0.1 로 걸었다가 실제로 겪었다 — 기동 실패, 정작 뜬 뒤 사용량은 10%).
#
# 예산 (고정 계층 합 6.6 코어 — 멱등 클러스터 3노드 포함):
#   1대 = 6.6 + 1.2 = 7.8 / 2대 = 6.6 + 2.4 = 9.0.
#   여기에 무제한으로 둔 주변부(약 0.5~1.0)·관측(약 0.3)·호스트 k6(피크 약 0.6)를 더해도
#   10 코어 안에 들어온다. cpus 는 예약이 아니라 상한이라 동시에 전부 피크치지도 않는다.
#
# 스택 순서: 다른 파일 뒤에 얹는다. command 같은 배열 키를 건드리지 않으므로
# docker-compose.scaleout.yml 의 mysql-payment command(복제 플래그 + max_connections)는 살아남는다.
#
# 사용:
#   EXTRA_COMPOSE_FILES=docker/docker-compose.cpulimit.yml \
#     INSTANCES=2 bash scripts/bench-scaleout-cycle.sh

services:

  # ───────────────────────────────────────────
  # 측정 변수 — 인스턴스당 고정 예산
  # ───────────────────────────────────────────
  payment-service:
    cpus: ${LIMIT_PAYMENT_CPUS:-1.2}

  # ───────────────────────────────────────────
  # 공유 자원 — 대수와 무관하게 고정
  # ───────────────────────────────────────────
  pg-service:
    cpus: ${LIMIT_PG_CPUS:-2.0}

  mysql-payment:
    cpus: ${LIMIT_MYSQL_CPUS:-1.2}

  mysql-payment-replica:
    cpus: ${LIMIT_MYSQL_REPLICA_CPUS:-1.4}

  kafka:
    cpus: ${LIMIT_KAFKA_CPUS:-1.4}

  redis-dedupe:
    cpus: 0.1

  redis-stock:
    cpus: 0.1

  redis-stock-cluster:
    cpus: 0.1

  redis-idempotency-cluster:
    cpus: 0.1
