plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.4' apply false
    id 'io.spring.dependency-management' version '1.1.6' apply false
    id 'jacoco'
    id 'checkstyle'
    id 'com.github.spotbugs' version '6.0.9' apply false
    // T2: 통합테스트 자동 재시도 — 서비스별 plugins{} 에서 apply 후 integrationTest 블록에 wiring
    id 'org.gradle.test-retry' version '1.6.5' apply false
}

// Checkstyle 버전 단일 소스. Gradle 플러그인 toolVersion, 커스텀 Check 컴파일 의존, 편집 훅이 쓰는
// CLI 의존이 모두 이 값을 참조한다 — 한 곳만 올리면 훅이 옛 버전으로 검사해 CLI 와 빌드 게이트의
// 판정이 갈린다.
ext.checkstyleVersion = '10.17.0'

allprojects {
    group = 'com.hyoguoo'
    version = '3.0.0'
    repositories {
        mavenCentral()
    }
}

// 구조 판정이 필요한 코드 스타일 검사(광범위 예외 삼킴 금지, try 블록 외부 변수 재할당 금지)를 위한
// checkstyle 커스텀 Check 모듈. 별도 subproject 로 만들지 않고 root project 자체 전용 sourceSet 에
// 격리한다 — root project 의 기본 main/test sourceSet 은 비워 두고, checkstyleMain/checkstyleTest 도
// 이 목적에 쓰지 않으므로 비활성화한다. (이 sourceSet 자체를 checkstyle.xml 로 검사하려 하면 아직
// classpath 에 올라가지 않은 자기 자신의 커스텀 규칙을 요구해 순환에 빠지므로 별도 task 도 끈다.)
sourceSets {
    checkstyleCustomChecks {
        java {
            srcDirs = ['config/checkstyle/custom-checks/src/main/java']
        }
        resources {
            srcDirs = ['config/checkstyle/custom-checks/src/main/resources']
        }
    }

    // 4서비스가 공유하는 ArchUnit hexagonal 규칙. 서비스별 test sourceSet 에서 참조하며,
    // 규칙 정의를 서비스마다 복제하지 않기 위해 root project 전용 sourceSet 으로 둔다.
    archRules {
        java {
            srcDirs = ['config/archunit/src/main/java']
        }
    }
}

dependencies {
    // subprojects 블록의 checkstyle { toolVersion } 과 반드시 같은 버전을 유지한다.
    checkstyleCustomChecksImplementation "com.puppycrawl.tools:checkstyle:${checkstyleVersion}"
    // subprojects 의 testImplementation archunit 과 반드시 같은 버전을 유지한다.
    archRulesImplementation 'com.tngtech.archunit:archunit-junit5:1.3.0'
}

tasks.matching { it.name in ['checkstyleMain', 'checkstyleTest', 'checkstyleCheckstyleCustomChecks', 'checkstyleArchRules'] }
        .configureEach { enabled = false }

// 편집 직후 훅(.claude/hooks/checkstyle-file.sh)이 쓰는 Checkstyle CLI classpath 를 파일로 떨군다.
// Gradle 태스크는 모듈 전체를 돌아 편집 직후 피드백으로 쓰기엔 느리므로 훅은 CLI 를 파일 하나에만
// 직접 물린다. 그런데 checkstyle 본체 jar 만으로는 실행되지 않고(picocli 등 전이 의존 필요) 그
// 목록을 훅이 직접 조립하면 깨지기 쉬우므로, Gradle 이 이미 해석해 둔 것을 그대로 넘긴다.
// Gradle checkstyle 플러그인의 tool configuration 은 워커 안에서만 완결되어 CLI 로 그대로
// 실행되지 않는다(commons-logging 등이 빠져 있다). CLI 전용 configuration 을 따로 둔다.
configurations {
    checkstyleCli
}

dependencies {
    checkstyleCli "com.puppycrawl.tools:checkstyle:${checkstyleVersion}"
    checkstyleCli 'commons-logging:commons-logging:1.3.4'
}

tasks.register('writeCheckstyleCliClasspath') {
    dependsOn sourceSets.checkstyleCustomChecks.classesTaskName
    description = '편집 직후 훅이 쓰는 Checkstyle CLI classpath 와 설정 프로퍼티를 기록한다.'
    def classpathFile = layout.buildDirectory.file('checkstyle-cli-classpath.txt')
    def propertiesFile = layout.buildDirectory.file('checkstyle-cli.properties')
    def cliClasspath = configurations.checkstyleCli
    def customChecks = sourceSets.checkstyleCustomChecks.output
    def configDir = rootProject.file('config/checkstyle').absolutePath
    outputs.files(classpathFile, propertiesFile)
    doLast {
        File target = classpathFile.get().asFile
        target.parentFile.mkdirs()
        target.text = cliClasspath.asPath + File.pathSeparator + customChecks.asPath
        // config_loc 은 Gradle 플러그인이 주입하는 값이라 CLI 에는 없다. suppressions 파일 경로
        // 해석에 쓰이므로 직접 넘겨준다.
        propertiesFile.get().asFile.text = "config_loc=" + configDir.replace('\\', '/') + "\n"
    }
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'io.spring.dependency-management'
    apply plugin: 'jacoco'
    apply plugin: 'checkstyle'
    apply plugin: 'com.github.spotbugs'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    dependencyManagement {
        imports {
            mavenBom "org.springframework.boot:spring-boot-dependencies:3.4.4"
        }
    }

    dependencies {
        compileOnly 'org.projectlombok:lombok'
        annotationProcessor 'org.projectlombok:lombok'
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
        // hexagonal 레이어 규칙 — 정의는 rootProject 의 archRules sourceSet 한 곳에만 둔다.
        // (root dependencies 의 archRulesImplementation 과 같은 버전을 유지한다.)
        testImplementation 'com.tngtech.archunit:archunit-junit5:1.3.0'
        testImplementation rootProject.sourceSets.archRules.output
        // 구조 판정 커스텀 Check(광범위 예외 삼킴, try 블록 외부 변수 재할당) — root project 전용
        // sourceSet 산출물을 이 서비스의 checkstyle 실행 classpath 에 추가한다. checkstyle 설정에
        // 직접 dependency 를 추가하면 Gradle 이 tool 본체 기본 dependency 를 더 이상 자동으로
        // 넣어주지 않으므로, 같은 버전(checkstyle { toolVersion } 과 동일하게 유지)의 tool 본체도
        // 함께 명시한다.
        checkstyle "com.puppycrawl.tools:checkstyle:${rootProject.checkstyleVersion}"
        checkstyle rootProject.sourceSets.checkstyleCustomChecks.output
    }

    // Checkstyle Configuration
    checkstyle {
        toolVersion = rootProject.checkstyleVersion
        configFile = rootProject.file('config/checkstyle/checkstyle.xml')
        ignoreFailures = false
        // 경고 계층을 두지 않는다 — 경고는 아무도 고치지 않아 규칙이 있다는 착각만 남긴다.
        // 규칙은 빌드를 깨뜨리거나 아예 없거나 둘 중 하나다. 새 규칙을 warning 으로
        // 추가하는 것도 이 설정이 막는다.
        maxWarnings = 0
    }

    // SpotBugs Configuration
    spotbugs {
        ignoreFailures = false
        showProgress = false
    }

    // JaCoCo Configuration
    jacoco {
        toolVersion = '0.8.11'
    }

    // Test Configuration
    test {
        useJUnitPlatform {
            excludeTags 'integration'
        }

        jvmArgs '-XX:+EnableDynamicAgentLoading', '-Xshare:off'

        testLogging {
            events = ['passed', 'skipped', 'failed']
            exceptionFormat = 'full'
            showStandardStreams = false

            afterSuite { desc, result ->
                if (!desc.parent) {
                    println "\nTest Results: ${result.resultType} " +
                            "(${result.testCount} tests, " +
                            "${result.successfulTestCount} passed, " +
                            "${result.failedTestCount} failed, " +
                            "${result.skippedTestCount} skipped)"
                }
            }
        }

        finalizedBy jacocoTestReport
    }

    jacocoTestReport {
        dependsOn test

        reports {
            html.required = true
            xml.required = true
            csv.required = false
        }

        def excludePatterns = [
                '**/Q*',
                '**/dto/**',
                '**/entity/**',
                '**/enums/**',
                '**/event/**',
                '**/exception/**',
                '**/infrastructure/**',
                '**/presentation/**',
                '**/publisher/**',
                '**/mock/**',
                '**/aspect/**',
                '**/metrics/**',
                '**/log/**',
                '**/filter/**',
                '**/util/**',
                '**/config/**',
                '**/response/**',
                '**/*Application.class'
        ]
        classDirectories.setFrom(
                files(classDirectories.files.collect { fileTree(dir: it, excludes: excludePatterns) })
        )

        finalizedBy jacocoTestCoverageVerification
    }

    // 커버리지 게이트(jacocoTestCoverageVerification)는 단위 test exec 기준으로만 평가한다.
    // 통합테스트 정합성은 integration-test job 통과(pass/fail)로 보호한다.
    // (review 피드백 반영: CI build job 이 -x integrationTest 로 실행되어 통합 exec 가 없는 상황에서
    //  게이트가 통합 exec 를 합산하면 항상 BUILD FAILED 가 되는 구조적 문제 해소)
    afterEvaluate {
        // jacocoTestReport 와 jacocoTestCoverageVerification 모두 단위 test.exec 기준으로 동일하게 평가한다.
        // 통합 exec 는 합산하지 않으며, 통합 정합성은 integration-test job 통과(pass/fail)로 보호한다.

        // jacocoTestCoverageVerification 에 단위 test.exec 만 연결 — 게이트가 단위 커버리지만 평가.
        jacocoTestCoverageVerification.dependsOn jacocoTestReport
        jacocoTestCoverageVerification.executionData(new File(buildDir, 'jacoco/test.exec'))

        // classDirectories 는 jacocoTestReport 와 동일한 excludePatterns 를 공유한다.
        def excludePatterns = [
                '**/Q*',
                '**/dto/**',
                '**/entity/**',
                '**/enums/**',
                '**/event/**',
                '**/exception/**',
                '**/infrastructure/**',
                '**/presentation/**',
                '**/publisher/**',
                '**/mock/**',
                '**/aspect/**',
                '**/metrics/**',
                '**/log/**',
                '**/filter/**',
                '**/util/**',
                '**/config/**',
                '**/response/**',
                '**/*Application.class'
        ]
        jacocoTestCoverageVerification.classDirectories.setFrom(
                files(sourceSets.main.output.classesDirs.collect { fileTree(dir: it, excludes: excludePatterns) })
        )

        // 서비스별 LINE 커버리지 minimum 을 ext 속성에서 읽어 violationRules limit 에 적용.
        // subprojects 블록 평가 완료 후 afterEvaluate 에서 읽어야 서비스 ext 값이 반영된다.
        def lineCoverageMinimum = project.ext.has('jacoco.lineCoverageMinimum')
                ? project.ext.get('jacoco.lineCoverageMinimum') as BigDecimal
                : BigDecimal.ZERO
        jacocoTestCoverageVerification.violationRules.rules.each { rule ->
            rule.limits.each { lim ->
                if (lim.counter == 'LINE' && lim.value == 'COVEREDRATIO') {
                    lim.minimum = lineCoverageMinimum
                }
            }
        }
    }

    jacocoTestCoverageVerification {
        violationRules {
            // BUNDLE 단위 LINE 커버리지 게이트 — 전체 번들 합산으로 체크.
            // element = 'CLASS' 는 클래스별로 minimum 을 강제해 테스트가 없는 관리 기능 클래스가 있으면
            // 전체 플로우가 차단됨. BUNDLE 이 실측 기반 minimum 과 의미적으로 정합.
            rule {
                element = 'BUNDLE'

                // LINE minimum 은 afterEvaluate 에서 서비스별 ext 속성을 읽어 동적으로 설정한다.
                // (서비스 build.gradle 의 ext 는 subprojects 블록 평가 후 반영 — 여기서 직접 읽으면 0.0 이 됨)
                limit {
                    counter = 'LINE'
                    value = 'COVEREDRATIO'
                    minimum = 0.0
                }
            }
        }
    }
}
