# promtool test rules 픽스처 — DLQ 적체 알람
# 실행(로컬 promtool 미설치 시 docker 경유):
#   docker run --rm --entrypoint /bin/promtool \
#     -v "$(pwd)/observability/prometheus:/work" \
#     prom/prometheus:v2.51.2 \
#     test rules /work/rules/tests/dlq_test.yml

rule_files:
  - "../dlq.yml"

evaluation_interval: 1m

tests:
  # (a) 앱 카운터 increase > 0 → DlqAppCounterRising FIRING
  # EOS 커밋 실패 DLQ 도달 카운터 증가: 0→0→0→1→2→3 (매 1분)
  # t=3m: increase([5m])=1>0 → PENDING, t=4m: for:1m 충족 → FIRING
  - interval: 1m
    input_series:
      - series: 'payment_eos_commit_failure_dlq_total'
        values: '0 0 0 1 2 3'
    alert_rule_test:
      - eval_time: 5m
        alertname: DlqAppCounterRising
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "DLQ 앱 도달 카운터 증가"
              description: "DLQ 도달 3건 (5분 창). EOS 커밋 실패 또는 pg 재시도 소진 건 종결 발생(자동 승인·자동 실패·격리 포함)."

  # (b) .dlq 토픽 offset increase > 0 → DlqTopicOffsetRising FIRING
  # kafka-exporter offset 증가: t=3m부터 offset 상승
  # t=3m: increase([5m])>0 → PENDING, t=4m: for:1m 충족 → FIRING
  - interval: 1m
    input_series:
      - series: 'kafka_topic_partition_current_offset{topic="payment.events.confirmed.dlq",partition="0"}'
        values: '0 0 0 1 2 3'
    alert_rule_test:
      - eval_time: 5m
        alertname: DlqTopicOffsetRising
        exp_alerts:
          - exp_labels:
              severity: warning
              topic: payment.events.confirmed.dlq
              partition: "0"
            exp_annotations:
              summary: "DLQ 토픽 offset 증가"
              description: "payment.events.confirmed.dlq 토픽 offset 3 증가 (5분 창). .dlq 토픽에 새 메시지 발행 감지."

  # (c) 정상(델타 0) → no alert
  # 앱 카운터·offset·lag 모두 정적 — 3개 알람 모두 미발화
  # offset=10(고정)은 이미 적재된 메시지가 있지만 신규 유입 없음을 표현
  - interval: 1m
    input_series:
      - series: 'payment_eos_commit_failure_dlq_total'
        values: '0 0 0 0 0 0'
      - series: 'kafka_topic_partition_current_offset{topic="payment.events.confirmed.dlq",partition="0"}'
        values: '10 10 10 10 10 10'
      - series: 'kafka_consumergroup_lag{topic="payment.commands.confirm.dlq",consumergroup="pg-service-dlq"}'
        values: '0 0 0 0 0 0'
    alert_rule_test:
      - eval_time: 5m
        alertname: DlqAppCounterRising
        exp_alerts: []
      - eval_time: 5m
        alertname: DlqTopicOffsetRising
        exp_alerts: []
      - eval_time: 5m
        alertname: DlqCommandsConsumerLag
        exp_alerts: []

  # (d) 앱 카운터만↑(offset 증가 없음) → DlqAppCounterRising만 FIRING
  # 두 알람 독립 발화(합산 아님) 회귀 고정:
  #   DlqTopicOffsetRising 시리즈 미제공 → increase=no data → 미발화
  - interval: 1m
    input_series:
      - series: 'payment_eos_commit_failure_dlq_total'
        values: '0 0 0 1 2 3'
    alert_rule_test:
      - eval_time: 5m
        alertname: DlqAppCounterRising
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "DLQ 앱 도달 카운터 증가"
              description: "DLQ 도달 3건 (5분 창). EOS 커밋 실패 또는 pg 재시도 소진 건 종결 발생(자동 승인·자동 실패·격리 포함)."
      - eval_time: 5m
        alertname: DlqTopicOffsetRising
        exp_alerts: []

  # (e) 토픽 offset만↑(앱 카운터 증가 없음) → DlqTopicOffsetRising만 FIRING
  # 두 알람 독립 발화(합산 아님) 회귀 고정:
  #   앱 카운터 시리즈 미제공 → increase=no data → 미발화
  - interval: 1m
    input_series:
      - series: 'kafka_topic_partition_current_offset{topic="payment.commands.confirm.dlq",partition="0"}'
        values: '0 0 0 1 2 3'
    alert_rule_test:
      - eval_time: 5m
        alertname: DlqTopicOffsetRising
        exp_alerts:
          - exp_labels:
              severity: warning
              topic: payment.commands.confirm.dlq
              partition: "0"
            exp_annotations:
              summary: "DLQ 토픽 offset 증가"
              description: "payment.commands.confirm.dlq 토픽 offset 3 증가 (5분 창). .dlq 토픽에 새 메시지 발행 감지."
      - eval_time: 5m
        alertname: DlqAppCounterRising
        exp_alerts: []

  # (f) commands.confirm.dlq 컨슈머 정체(backlog 잔존) → DlqCommandsConsumerLag FIRING
  # DLQ 메시지 도착 멈춤 + lag 잔존: offset 증가 없지만 lag > 0 → backstop 발화
  # DlqTopicOffsetRising 미발화 확인 — backstop이 onset-only 신호 사각을 보완함
  - interval: 1m
    input_series:
      - series: 'kafka_consumergroup_lag{topic="payment.commands.confirm.dlq",consumergroup="pg-service-dlq"}'
        values: '5 5 5 5 5 5'
    alert_rule_test:
      - eval_time: 5m
        alertname: DlqCommandsConsumerLag
        exp_alerts:
          - exp_labels:
              severity: warning
              topic: payment.commands.confirm.dlq
              consumergroup: pg-service-dlq
            exp_annotations:
              summary: "payment.commands.confirm.dlq 컨슈머 정체"
              description: "pg-service-dlq 컨슈머 잔여 적체 5 messages. 도착 멈춤 후 미배수 결제 존재 가능."
      - eval_time: 5m
        alertname: DlqTopicOffsetRising
        exp_alerts: []

  # (g) pg 관문 결과 카운터의 격리 태그만↑(payment_eos 평탄) → DlqAppCounterRising FIRING (pg 분기)
  # OR 분기 pg 경로 회귀 고정: pg_final_confirmation_outcome_total{outcome="indeterminate"} 단독
  # 증가 시 발화 검증(격리 사유로 종결되는 기존 경로).
  # payment_eos_commit_failure_dlq_total 평탄(increase=0) → EOS 경로 분기 미발화.
  # t=3m: increase(outcome[5m])=1>0 → PENDING, t=4m: for:1m 충족 → FIRING
  - interval: 1m
    input_series:
      - series: 'pg_final_confirmation_outcome_total{outcome="indeterminate"}'
        values: '0 0 0 1 2 3'
      - series: 'payment_eos_commit_failure_dlq_total'
        values: '0 0 0 0 0 0'
    alert_rule_test:
      - eval_time: 5m
        alertname: DlqAppCounterRising
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "DLQ 앱 도달 카운터 증가"
              description: "DLQ 도달 3건 (5분 창). EOS 커밋 실패 또는 pg 재시도 소진 건 종결 발생(자동 승인·자동 실패·격리 포함)."

  # (h) 소진 건이 전부 자동 승인으로 종결(격리 없음, payment_eos 평탄)해도
  # DlqAppCounterRising FIRING — 격리 도달만 세던 이전 표현식이 놓치던 신호를 복원했는지 검증.
  # outcome="approved" 만 증가하고 격리 계열 태그는 관측되지 않는(no data) 입력.
  # t=3m: increase(outcome{approved}[5m])=1>0 → PENDING, t=4m: for:1m 충족 → FIRING
  - interval: 1m
    input_series:
      - series: 'pg_final_confirmation_outcome_total{outcome="approved"}'
        values: '0 0 0 1 2 3'
      - series: 'payment_eos_commit_failure_dlq_total'
        values: '0 0 0 0 0 0'
    alert_rule_test:
      - eval_time: 5m
        alertname: DlqAppCounterRising
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "DLQ 앱 도달 카운터 증가"
              description: "DLQ 도달 3건 (5분 창). EOS 커밋 실패 또는 pg 재시도 소진 건 종결 발생(자동 승인·자동 실패·격리 포함)."

  # (i) product-service 재고 확정 격리 토픽(stock-committed.dlq) offset increase>0
  # → ProductStockQuarantineBacklog FIRING(critical). 같은 입력이 DlqTopicOffsetRising(정규식
  # topic=~".*\\.dlq")도 동시에 발화시키는 것까지 함께 고정한다 — 두 알람이 같은 신호를 서로 다른
  # severity/설명으로 중복 관측하는 것은 의도된 동작이지 충돌이 아니다.
  # t=3m: increase([5m])=1>0 → PENDING, t=4m: for:1m 충족 → FIRING
  - interval: 1m
    input_series:
      - series: 'kafka_topic_partition_current_offset{topic="payment.events.stock-committed.dlq",partition="0"}'
        values: '0 0 0 1 2 3'
    alert_rule_test:
      - eval_time: 5m
        alertname: ProductStockQuarantineBacklog
        exp_alerts:
          - exp_labels:
              severity: critical
              topic: payment.events.stock-committed.dlq
              partition: "0"
            exp_annotations:
              summary: "상품 서비스 재고 확정 격리 적체"
              description: >-
                payment.events.stock-committed.dlq 에 새 메시지 3건 도달 (5분 창).
                이미 과금된 결제의 재고 확정이 음수 가드에 막혀 격리됨 — 자동 복구 대상 아님, 사람이
                환불 또는 입고를 판단해야 한다. 대응 전 런북의 분류 기준(관리자 재고 조정 직후 발화인지)
                부터 확인한다.
      - eval_time: 5m
        alertname: DlqTopicOffsetRising
        exp_alerts:
          - exp_labels:
              severity: warning
              topic: payment.events.stock-committed.dlq
              partition: "0"
            exp_annotations:
              summary: "DLQ 토픽 offset 증가"
              description: "payment.events.stock-committed.dlq 토픽 offset 3 증가 (5분 창). .dlq 토픽에 새 메시지 발행 감지."
