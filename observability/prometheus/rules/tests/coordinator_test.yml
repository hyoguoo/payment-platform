# promtool test rules 픽스처 — coordinator 정체 알람
# 실행(로컬 promtool 미설치 시 docker 경유):
#   docker run --rm --entrypoint /bin/promtool \
#     -v "$(pwd)/observability/prometheus:/work" \
#     prom/prometheus:v2.51.2 \
#     test rules /work/rules/tests/coordinator_test.yml

rule_files:
  - "../coordinator.yml"

evaluation_interval: 1m

tests:
  # (a) txn abort 급증 → KafkaCoordinatorTxnAbortRising FIRING
  # 매 1분 120_000_000 ns 증가 → rate ≈ 2_000_000 ns/s > 임계 1_000_000 ns/s
  # t=1m: 조건 첫 true(PENDING), t=2m: for:1m 충족 → FIRING
  - interval: 1m
    input_series:
      - series: 'kafka_producer_txn_abort_time_ns_total{job="payment-service"}'
        values: '0 120000000 240000000 360000000 480000000 600000000'
    alert_rule_test:
      - eval_time: 5m
        alertname: KafkaCoordinatorTxnAbortRising
        exp_alerts:
          - exp_labels:
              severity: warning
              job: payment-service

  # (b) payment.events.confirmed consumer lag 급증 → KafkaCoordinatorLagHigh FIRING
  # lag: t=3m(1500) 부터 임계 1000 초과 → PENDING, t=4m for:1m 충족 → FIRING
  - interval: 1m
    input_series:
      - series: 'kafka_consumergroup_lag{topic="payment.events.confirmed",consumergroup="payment-service"}'
        values: '0 500 1000 1500 2000 2500'
    alert_rule_test:
      - eval_time: 5m
        alertname: KafkaCoordinatorLagHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              topic: payment.events.confirmed
              consumergroup: payment-service

  # (c1) kafka-exporter scrape 실패(up==0) → KafkaBrokerUnavailable FIRING
  # t=5m: up=0 PENDING, t=6m: for:1m 충족 → FIRING
  - interval: 1m
    input_series:
      - series: 'up{job="kafka-exporter"}'
        values: '1 1 1 1 1 0 0 0'
    alert_rule_test:
      - eval_time: 7m
        alertname: KafkaBrokerUnavailable
        exp_alerts:
          - exp_labels:
              severity: critical
              job: kafka-exporter

  # (c2) kafka broker 수 0 → KafkaBrokerUnavailable FIRING
  # t=5m: kafka_brokers=0 < 1 PENDING, t=6m: for:1m 충족 → FIRING
  - interval: 1m
    input_series:
      - series: 'kafka_brokers'
        values: '3 3 3 3 3 0 0 0'
    alert_rule_test:
      - eval_time: 7m
        alertname: KafkaBrokerUnavailable
        exp_alerts:
          - exp_labels:
              severity: critical

  # (d) 정상 baseline abort rate (임계 미만, 0 아님) → no alert
  # 매 1분 30_000 ns 증가 → rate ≈ 500 ns/s < 임계 1_000_000 ns/s
  # 알람 피로 방지 회귀 고정: 정상 abort 수준에서 미발화 보장
  - interval: 1m
    input_series:
      - series: 'kafka_producer_txn_abort_time_ns_total{job="payment-service"}'
        values: '0 30000 60000 90000 120000 150000 180000 210000'
    alert_rule_test:
      - eval_time: 7m
        alertname: KafkaCoordinatorTxnAbortRising
        exp_alerts: []
