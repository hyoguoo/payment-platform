# promtool test rules 픽스처 — 서비스·의존성 가용성 알람
# 실행(로컬 promtool 미설치 시 docker 경유):
#   docker run --rm --entrypoint /bin/promtool \
#     -v "$(pwd)/observability/prometheus:/work" \
#     prom/prometheus:v2.51.2 \
#     test rules /work/rules/tests/availability_test.yml

rule_files:
  - "../availability.yml"

evaluation_interval: 1m

tests:
  # (a1) 서비스 프로세스 다운(up==0) → ServiceDown FIRING
  # scrape 실패 시 up{job="payment-service"}==0 발화 검증.
  # t=5m: up=0 PENDING(조건 첫 true), t=6m: for:1m 충족 → FIRING.
  - interval: 1m
    input_series:
      - series: 'up{job="payment-service"}'
        values: '1 1 1 1 1 0 0 0'
    alert_rule_test:
      - eval_time: 6m
        alertname: ServiceDown
        exp_alerts:
          - exp_labels:
              severity: critical
              job: payment-service
            exp_annotations:
              summary: "서비스 프로세스 다운 (payment-service)"
              description: "payment-service scrape 실패 — 서비스 프로세스 또는 네트워크 이상."

  # (a2) 서비스 정상(up==1) → ServiceDown 미발화
  # 알람 피로 방지 회귀 고정: 정상 환경에서 발화하지 않음을 보장.
  - interval: 1m
    input_series:
      - series: 'up{job="payment-service"}'
        values: '1 1 1 1 1 1 1 1'
    alert_rule_test:
      - eval_time: 7m
        alertname: ServiceDown
        exp_alerts: []

  # (b) 의존성 다운(dependency_up==0) → DependencyDown FIRING
  # db 컴포넌트 다운 시 component 라벨 보존 검증.
  # for 없음(즉시 평가) — 의존성 다운은 즉시 알람이 적합(폴링 주기 10s, 지연 불필요).
  # t=0m: dependency_up{component="db"}=0 → 즉시 FIRING.
  - interval: 1m
    input_series:
      - series: 'dependency_up{component="db",job="payment-service"}'
        values: '0 0 0'
    alert_rule_test:
      - eval_time: 0m
        alertname: DependencyDown
        exp_alerts:
          - exp_labels:
              severity: critical
              component: db
              job: payment-service
            exp_annotations:
              summary: "의존성 가용성 이상 (db)"
              description: "dependency_up{component=\"db\"} == 0. DB·Redis 등 의존성 다운 또는 health 폴러 타임아웃."

  # (c) redis-stock 단독 다운 → DependencyDown FIRING, redis-dedupe 는 미발화
  # 컴포넌트 분리 검증: 한쪽 다운이 다른쪽에 영향 없음을 단정(dead branch 방지 — payment redis 분리 설계).
  # redis-stock=0, redis-dedupe=1 → redis-stock 만 발화, redis-dedupe 는 정상으로 미발화.
  - interval: 1m
    input_series:
      - series: 'dependency_up{component="redis-stock",job="payment-service"}'
        values: '0 0 0'
      - series: 'dependency_up{component="redis-dedupe",job="payment-service"}'
        values: '1 1 1'
    alert_rule_test:
      - eval_time: 0m
        alertname: DependencyDown
        exp_alerts:
          - exp_labels:
              severity: critical
              component: redis-stock
              job: payment-service
            exp_annotations:
              summary: "의존성 가용성 이상 (redis-stock)"
              description: "dependency_up{component=\"redis-stock\"} == 0. DB·Redis 등 의존성 다운 또는 health 폴러 타임아웃."

  # (d1) 폴러 staleness → DependencyHealthStale FIRING
  # time() - dependency_health_last_poll_timestamp_seconds > 60s 초과 시 발화.
  # t=0m: last_poll=0(epoch 기원), time()=0 → 차이=0 → 미발화.
  # promtool 의 time() 는 테스트 시작(0) + eval_time 으로 진행.
  # last_poll 을 고정(0)으로 두고 eval_time=2m(120s) → 120 > 60 → FIRING.
  - interval: 1m
    input_series:
      - series: 'dependency_health_last_poll_timestamp_seconds{job="payment-service"}'
        values: '0 0 0 0'
    alert_rule_test:
      - eval_time: 2m
        alertname: DependencyHealthStale
        exp_alerts:
          - exp_labels:
              severity: warning
              job: payment-service
            exp_annotations:
              summary: "의존성 가용성 폴러 갱신 지연 (payment-service)"
              description: "dependency_health_last_poll_timestamp_seconds 가 60s 이상 갱신되지 않음. 폴러 블로킹 또는 스레드 사망 의심."

  # (d2) 폴러 정상(최근 갱신) → DependencyHealthStale 미발화
  # last_poll 이 매 eval 직전 갱신된다면 staleness 미발화를 보장.
  # last_poll=time()-10(10초 전) → 차이=10 < 60 → 미발화.
  # eval_time=5m(300s): last_poll=290(300-10) → 차이=10 < 60 → 미발화.
  - interval: 1m
    input_series:
      - series: 'dependency_health_last_poll_timestamp_seconds{job="payment-service"}'
        values: '290 291 292 293 294 295'
    alert_rule_test:
      - eval_time: 5m
        alertname: DependencyHealthStale
        exp_alerts: []

  # (e1) dependency_up 시리즈 부재(absent) → absent() backstop으로 DependencyDown FIRING
  # PITFALLS §24 회귀 고정: 메트릭 미등록·오타로 시리즈 자체 부재 시 dependency_up==0 단독은
  # dead branch — absent() 분기가 이를 포착함을 검증.
  # (promtool 의 '_' gap 은 staleness 로 absent 를 부정확하게 시뮬하므로,
  #  시리즈를 선언하지 않아 absent 를 정확히 재현한다 — coordinator_test.yml c3 케이스 동형.)
  # absent 는 평가 시작부터 즉시 true → t=0m 조건 참 → FIRING(for 없음).
  - interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 0m
        alertname: DependencyDown
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "의존성 가용성 이상 (unknown)"
              description: "dependency_up 시리즈 부재 — 메트릭 미등록 또는 scrape 중단."

  # (e2) dependency_health_last_poll_timestamp_seconds 시리즈 부재(absent) → DependencyHealthStale FIRING
  # 동일 원리: 폴러가 아예 메트릭을 등록하지 못한 경우 absent() 분기 발화.
  # absent 는 즉시 true → t=2m for 없음(즉시 평가) → FIRING.
  - interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 0m
        alertname: DependencyHealthStale
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "의존성 가용성 폴러 갱신 지연 (unknown)"
              description: "dependency_health_last_poll_timestamp_seconds 시리즈 부재 — 폴러 미기동 또는 메트릭 미등록."

  # (f) 정상 baseline 전체 미발화
  # 모든 서비스 up, 모든 컴포넌트 dependency_up=1, 폴러 최근 갱신 상태에서
  # ServiceDown·DependencyDown·DependencyHealthStale 모두 발화하지 않음을 단정.
  # 알람 피로 방지의 핵심 회귀 고정.
  - interval: 1m
    input_series:
      - series: 'up{job="payment-service"}'
        values: '1 1 1 1 1 1'
      - series: 'up{job="pg-service"}'
        values: '1 1 1 1 1 1'
      - series: 'up{job="product-service"}'
        values: '1 1 1 1 1 1'
      - series: 'up{job="user-service"}'
        values: '1 1 1 1 1 1'
      - series: 'dependency_up{component="db",job="payment-service"}'
        values: '1 1 1 1 1 1'
      - series: 'dependency_up{component="redis-dedupe",job="payment-service"}'
        values: '1 1 1 1 1 1'
      - series: 'dependency_up{component="redis-stock",job="payment-service"}'
        values: '1 1 1 1 1 1'
      - series: 'dependency_up{component="db",job="pg-service"}'
        values: '1 1 1 1 1 1'
      - series: 'dependency_up{component="redis",job="pg-service"}'
        values: '1 1 1 1 1 1'
      - series: 'dependency_up{component="db",job="product-service"}'
        values: '1 1 1 1 1 1'
      - series: 'dependency_up{component="db",job="user-service"}'
        values: '1 1 1 1 1 1'
      - series: 'dependency_health_last_poll_timestamp_seconds{job="payment-service"}'
        values: '290 291 292 293 294 295'
      - series: 'dependency_health_last_poll_timestamp_seconds{job="pg-service"}'
        values: '290 291 292 293 294 295'
      - series: 'dependency_health_last_poll_timestamp_seconds{job="product-service"}'
        values: '290 291 292 293 294 295'
      - series: 'dependency_health_last_poll_timestamp_seconds{job="user-service"}'
        values: '290 291 292 293 294 295'
    alert_rule_test:
      - eval_time: 5m
        alertname: ServiceDown
        exp_alerts: []
      - eval_time: 5m
        alertname: DependencyDown
        exp_alerts: []
      - eval_time: 5m
        alertname: DependencyHealthStale
        exp_alerts: []
