# 역할·모델 설정의 정본. 변경 후 python3 scripts/sync-agent-configs.py 실행.
# 메인 모델은 사용자가 선택한다. 역할별 effort는 서로 다른 엔진에서 같은 성능을 뜻하지 않는다.

[roles.implementer]
description = "독립적으로 맡길 수 있는 구현 태스크나 리뷰 수정 묶음을 구현하고 검증한다."
instructions = ".agents/roles/implementer.md"
claude_model = "sonnet"
claude_effort = "medium"
claude_tools = "Read, Grep, Glob, Edit, Write, Bash"
claude_color = "green"
codex_model = "gpt-6-sol"
codex_effort = "medium"

[roles.reviewer]
description = "설계·계획·코드 변경의 요구 충족, 회귀, 테스트 누락을 독립적으로 검토한다. 수정하지 않는다."
instructions = ".agents/roles/reviewer.md"
claude_model = "sonnet"
claude_effort = "high"
claude_tools = "Read, Grep, Glob, Bash"
claude_color = "red"
codex_model = "gpt-6-sol"
codex_effort = "high"
codex_sandbox_mode = "read-only"

[roles.domain-expert]
description = "결제 상태·멱등성·동시성·PG 실패·보상·금전과 재고 정합성의 위험을 검토한다. 수정하지 않는다."
instructions = ".agents/roles/domain-expert.md"
claude_model = "fable"
claude_effort = "high"
claude_tools = "Read, Grep, Glob, Bash"
claude_color = "purple"
codex_model = "gpt-6-astra"
codex_effort = "high"
codex_sandbox_mode = "read-only"
