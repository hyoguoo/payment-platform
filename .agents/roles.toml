# 역할·모델 설정의 정본. 변경 후 python3 scripts/sync-agent-configs.py 실행.
# 메인 모델은 사용자가 선택한다. 역할별 effort는 서로 다른 엔진에서 같은 성능을 뜻하지 않는다.

[roles.implementer]
description = "독립적으로 맡길 수 있는 구현 태스크나 리뷰 수정 묶음을 구현하고 검증한다. 메인이 태스크, 허용 쓰기 범위, 검증 명령을 지정해 호출한다."
instructions = ".agents/roles/implementer.md"
claude_model = "sonnet"
claude_effort = "medium"
claude_tools = "Read, Grep, Glob, Edit, Write, Bash"
claude_color = "green"
codex_model = "gpt-6-sol"
codex_effort = "medium"

[roles.reviewer]
description = "설계·계획·코드 변경이 요구와 설계를 충족하는지, 회귀와 테스트 누락이 없는지 독립적으로 검토한다. 파일을 수정하지 않는다."
instructions = ".agents/roles/reviewer.md"
claude_model = "sonnet"
claude_effort = "high"
claude_tools = "Read, Grep, Glob, Bash"
claude_color = "red"
codex_model = "gpt-6-sol"
codex_effort = "high"
codex_sandbox_mode = "read-only"

[roles.risk-reviewer]
description = "핵심 경로를 건드리는 설계나 코드 변경이 프로젝트의 불변식을 깨는지, 재시도·동시성·부분 실패 같은 장애 경로를 처리하는지 검토한다. 설계 사전 점검과 마무리 리뷰에 쓴다. 파일을 수정하지 않는다."
instructions = ".agents/roles/risk-reviewer.md"
claude_model = "opus"
claude_effort = "high"
claude_tools = "Read, Grep, Glob, Bash"
claude_color = "purple"
codex_model = "gpt-6-astra"
codex_effort = "high"
codex_sandbox_mode = "read-only"
